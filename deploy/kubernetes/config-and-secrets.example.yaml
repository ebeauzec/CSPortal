# Configuration and secrets. Copy to config-and-secrets.yaml, fill it in, and do NOT commit the copy.
# NOT TESTED ON A CLUSTER.
#
# Better: create the Secret from your secret store (external-secrets, sealed-secrets, or your platform's CSI driver)
# and do not keep the master key in any file on a laptop. The master key is the one value that decrypts everything
# the portal stores. Keep it apart from the data volume and from its backups.
apiVersion: v1
kind: ConfigMap
metadata:
  name: csportal-config
  namespace: csportal
data:
  config.json: |
    {
      "mode": "production",
      "data_dir": "/data",
      "public_url": "https://portal.example.net",
      "admin_public_url": "https://admin.example.net",
      "behind_proxy": true,
      "customer_listen": { "host": "0.0.0.0", "port": 8443 },
      "admin_listen": { "host": "0.0.0.0", "port": 8444 },
      "admin_allow_proxy": false,
      "session": { "idle_minutes": 30, "absolute_hours": 8 },
      "log": { "level": "INFO", "dir": "/data/logs", "max_mb": 50, "backups": 20, "json": true, "syslog": "" },
      "backend": { "type": "storagegrid", "storagegrid": { "password_env": "CSPORTAL_GRID_PASSWORD", "ca_file": "/etc/csportal/grid-ca.pem" } },
      "smtp": { "host": "smtp.example.net", "port": 587, "username": "csportal", "password_env": "CSPORTAL_SMTP_PASSWORD", "from": "portal@example.net", "starttls": true },
      "branding": { "name": "Example Cloud Storage", "product": "Object Storage", "color": "#0b5fff", "support_email": "support@example.net" }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: csportal-grid-ca
  namespace: csportal
data:
  grid-ca.pem: |
    -----BEGIN CERTIFICATE-----
    (paste the CA certificate that signed the grid's admin-node and S3 gateway certificates)
    -----END CERTIFICATE-----
---
apiVersion: v1
kind: Secret
metadata:
  name: csportal-secrets
  namespace: csportal
type: Opaque
stringData:
  master-key: "REPLACE-with-output-of: python -m csportal genkey"      # check-repo-ok: placeholder text
  grid-password: "REPLACE-with-the-grid-provisioning-password"      # check-repo-ok: placeholder text
  smtp-password: ""
---
# The customer ingress. TLS ends here. Replace the class, host and certificate secret. Do not add an admin host here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: csportal-customer
  namespace: csportal
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [portal.example.net]
      secretName: portal-example-net-tls
  rules:
    - host: portal.example.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: csportal-customer, port: { name: customer } } }
